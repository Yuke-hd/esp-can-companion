name: Set up iOS build
description: Selects Xcode, installs XcodeGen, generates the project and waits for the simulator.

runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      run: .github/scripts/select-xcode.sh

    - name: Install XcodeGen
      shell: bash
      run: brew install xcodegen xcbeautify

    - name: Generate Xcode project
      shell: bash
      run: xcodegen generate

    - name: Wait for simulator
      # CoreSimulator can still be loading when a job starts, so xcodebuild
      # sees no iOS devices and fails the destination lookup.
      shell: bash
      run: |
        for _ in $(seq 1 18); do
          if xcrun simctl list devices available | grep -q "iPhone 16 Pro ("; then exit 0; fi
          sleep 10
        done
        echo "::error::iPhone 16 Pro simulator did not become available"
        xcrun simctl list devices available
        exit 1
