name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Fixed device: skips the slow `simctl list` lookup and keeps results comparable.
  DESTINATION: platform=iOS Simulator,name=iPhone 16 Pro

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        # Newest installed Xcode 16 or later; falls back to the image default if none match.
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | grep -E 'Xcode_(1[6-9]|[2-9][0-9])(\.[0-9]+)*\.app$' | sort -V | tail -1 || true)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test CompanionKit package
        working-directory: Packages/CompanionKit
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme CompanionKit-Package \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Build and test app
        run: |
          set -o pipefail
          xcodebuild test \
            -project CANCompanion.xcodeproj \
            -scheme CANCompanion \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

  ui-tests:
    # Launches the app in the simulator and checks Drive's navigation,
    # rotation, on-screen layout and demo readouts through accessibility.
    # A separate job so it runs in parallel and fails as its own check.
    name: UI tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        # Newest installed Xcode 16 or later; falls back to the image default if none match.
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | grep -E 'Xcode_(1[6-9]|[2-9][0-9])(\.[0-9]+)*\.app$' | sort -V | tail -1 || true)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project CANCompanion.xcodeproj \
            -scheme "CANCompanion UI Tests" \
            -destination "$DESTINATION" \
            -resultBundlePath UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Upload UI test results
        # Keeps the captured Drive screenshots for a person to review.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: UITests.xcresult
          if-no-files-found: ignore
