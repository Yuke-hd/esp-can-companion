name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Fixed device: skips the slow `simctl list` lookup and keeps results comparable.
  # Jobs that run tests replace it with the id of the simulator they boot.
  DESTINATION: platform=iOS Simulator,name=iPhone 16 Pro

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs run in parallel. Four macOS jobs fit the free-plan limit of five:
# unit tests, the UI test build and two UI test shards. The EngineSim job runs
# on Linux and does not use that limit.
jobs:
  changes:
    # Decides which jobs a change needs. Anything that is not a pull request
    # runs everything.
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      companion: ${{ steps.filter.outputs.companion }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "companion=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "$files"
          # EngineSim tests run when its package or this workflow changes.
          if echo "$files" | grep -qE '^(Packages/EngineSim/|\.github/)'; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
          else
            echo "engine=false" >> "$GITHUB_OUTPUT"
          fi
          # CompanionKit, app and UI tests run only for files they build from or
          # that configure the build. The app declares the EngineSim package but
          # does not link it, so EngineSim-only changes do not need iOS jobs.
          if echo "$files" | grep -qE '^(App/|AppTests/|AppUITests/|Packages/CompanionKit/|Config/|project\.yml$|\.github/)'; then
            echo "companion=true" >> "$GITHUB_OUTPUT"
          else
            echo "companion=false" >> "$GITHUB_OUTPUT"
          fi

  engine-tests:
    # EngineSim is plain C++ with no Apple frameworks, so it tests on a cheaper,
    # more available Linux runner instead of macOS.
    name: EngineSim tests
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/fetch-enginesim

      - name: Test EngineSim package
        working-directory: Packages/EngineSim
        run: swift test -c release

  unit-tests:
    # Package and app unit tests share one job so the run stays within five
    # macOS jobs (the free-plan concurrency limit) with the UI build and shards.
    # Together they finish before the UI build plus its slowest shard.
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.companion == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/fetch-enginesim

      - uses: ./.github/actions/setup-ios

      # Starts after setup-ios: Homebrew took minutes to start while the
      # simulator booted.
      - uses: ./.github/actions/start-simulator

      - name: Build CompanionKit package tests
        # Compiles while the simulator boots.
        working-directory: Packages/CompanionKit
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -scheme CompanionKit-Package \
            -derivedDataPath "$RUNNER_TEMP/PackageDerivedData" \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Wait for simulator
        if: success() || failure()
        run: xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Test CompanionKit package
        working-directory: Packages/CompanionKit
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -scheme CompanionKit-Package \
            -derivedDataPath "$RUNNER_TEMP/PackageDerivedData" \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Reset simulator before app tests
        # Package tests and app tests share this job, but the app suite also
        # exercises Simulator audio. Start it from a clean CoreSimulator
        # process so package-test state cannot strand the audio callback.
        if: success() || failure()
        run: xcrun simctl shutdown all || true

      - name: Build and test app
        # Runs even when the package tests fail, so one run reports both.
        if: success() || failure()
        run: |
          set -o pipefail
          xcodebuild test \
            -project CANCompanion.xcodeproj \
            -scheme CANCompanion \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination "$DESTINATION" \
            -resultBundlePath "$RUNNER_TEMP/AppTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee "$RUNNER_TEMP/AppTests.xcodebuild.log" \
            | xcbeautify --renderer github-actions

      - name: Upload app test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-app-test-diagnostics
          path: |
            ${{ runner.temp }}/AppTests.xcresult
            ${{ runner.temp }}/AppTests.xcodebuild.log
          if-no-files-found: warn

  ui-build:
    # Builds the app and UI test bundle once. The shards run this build with
    # test-without-building instead of each compiling the app again.
    name: UI test build
    needs: changes
    if: needs.changes.outputs.companion == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/fetch-enginesim

      - uses: ./.github/actions/setup-ios

      - name: Build for UI testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project CANCompanion.xcodeproj \
            -scheme "CANCompanion UI Tests" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Package UI test build
        # tar keeps the bundle layout, symlinks and permissions that
        # upload-artifact would drop. The .xctestrun refers to the bundles
        # relative to itself, so the shards can unpack it anywhere.
        run: tar -czf "$RUNNER_TEMP/ui-test-build.tgz" -C "$RUNNER_TEMP/DerivedData/Build" Products

      - uses: actions/upload-artifact@v6
        with:
          name: ui-test-build
          path: ${{ runner.temp }}/ui-test-build.tgz
          retention-days: 1

  ui-tests:
    # Launches the app in the simulator and checks Drive's navigation,
    # rotation, on-screen layout and demo readouts through accessibility.
    # The tests wait on real-time demo scenarios and take about 11 minutes
    # in a row, so they are split across shards that run in parallel.
    name: UI tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [changes, ui-build]
    if: needs.changes.outputs.companion == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5

      # Boots while the job downloads the build. The shards skip setup-ios:
      # they run the built tests with no project, xcbeautify comes with the
      # runner image, and Homebrew took minutes to start while the simulator
      # booted.
      - uses: ./.github/actions/start-simulator

      - uses: actions/download-artifact@v7
        with:
          name: ui-test-build
          path: ${{ runner.temp }}

      - name: Unpack UI test build
        run: |
          mkdir -p "$RUNNER_TEMP/Build"
          tar -xzf "$RUNNER_TEMP/ui-test-build.tgz" -C "$RUNNER_TEMP/Build"
          xctestrun=$(ls "$RUNNER_TEMP"/Build/Products/*.xctestrun | head -1)
          echo "XCTESTRUN=$xctestrun" >> "$GITHUB_ENV"

      - name: Wait for simulator
        # A cold simulator makes the first app launch time out, so the tests
        # start only once it has finished booting.
        run: xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Run UI tests
        run: |
          set -o pipefail
          only_testing=$(.github/scripts/ui-test-shard.sh $(( ${{ matrix.shard }} - 1 )) ${{ strategy.job-total }})
          echo "Shard ${{ matrix.shard }}: $only_testing"
          run_tests() { # <result bundle> <-only-testing arguments>
            # shellcheck disable=SC2086 # one word per -only-testing argument
            xcodebuild test-without-building \
              -xctestrun "$XCTESTRUN" \
              -destination "$DESTINATION" \
              -resultBundlePath "$1" \
              $2 | xcbeautify --renderer github-actions
          }
          if run_tests UITests.xcresult "$only_testing"; then exit 0; fi

          # Retry only tests that failed because the app did not launch. Any
          # other failure is reported as is and still fails the job.
          status=0
          retry=$(.github/scripts/ui-test-launch-failures.sh UITests.xcresult) || status=$?
          if [ -z "$retry" ]; then exit 1; fi
          echo "::warning::Retrying UI tests after app launch failure: $retry"
          run_tests UITests-retry.xcresult "$retry"
          exit "$status"

      - name: Upload UI test results
        # Keeps the captured Drive screenshots for a person to review.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-results-${{ matrix.shard }}
          path: |
            UITests.xcresult
            UITests-retry.xcresult
          if-no-files-found: ignore
